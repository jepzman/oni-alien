name: Deploy to GitHub Pages

# Every push to main builds the PDFs that changed (the rest come from the PDF cache) and publishes public/ to
# GitHub Pages and (when the Cloudflare secrets exist) to the Cloudflare Worker mirror.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rebuild_pdfs:
        description: "Render every PDF again, ignoring the PDF cache"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # secrets can't be read in `if:` directly; this lets the Cloudflare step skip itself when unset
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      # PDFs from the last deploy, with a fingerprint of the page each was made from (scripts/build-pdf.mjs).
      # Restores the newest cache; a PDF is rendered again only when its page, the stylesheets or the script changed.
      - name: Restore the PDF cache
        uses: actions/cache/restore@v4
        with:
          path: .pdf-cache
          key: pdfs-${{ github.sha }}
          restore-keys: pdfs-

      # The runner image already has the system libraries Chromium needs, so we skip
      # `--with-deps` (it pulls ~100 apt packages and fails when Ubuntu mirrors are flaky).
      - name: Build the ready-made PDFs (only the ones that changed)
        timeout-minutes: 30
        env:
          PDF_FORCE: ${{ inputs.rebuild_pdfs && '1' || '' }}
        run: |
          npx playwright install chromium
          npm run pdf

      # Saved under the fingerprints' hash, so a deploy that changed no PDF adds no new cache entry.
      - name: Save the PDF cache
        uses: actions/cache/save@v4
        with:
          path: .pdf-cache
          key: pdfs-${{ hashFiles('.pdf-cache/manifest.json') }}

      - name: Make sure every page and PDF exists
        run: |
          node -e '
            const fs = require("fs");
            const journals = JSON.parse(fs.readFileSync("public/journals.json", "utf8"));
            const need = ["index.html", ...journals.flatMap((j) => [`${j.key}/index.html`, j.all, j.pdf,
                          ...j.notes.flatMap((n) => [n.page, n.pdf])])];
            const missing = need.filter((f) => !fs.existsSync("public/" + f) || fs.statSync("public/" + f).size === 0);
            if (missing.length) { console.error("Missing:", missing); process.exit(1); }
            console.log(`OK: ${need.length} files`);
          '
          touch public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # Same files (PDFs included) to the Cloudflare mirror: https://oni-alien.jepzman.workers.dev/
      # Uses wrangler.jsonc (Worker "oni-alien", static assets from ./public).
      - name: Deploy to Cloudflare Workers
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
