name: Deploy to GitHub Pages

# Every push to these branches rebuilds the PDFs and publishes public/ to GitHub Pages.
on:
  push:
    branches:
      - main
      - claude/design-patterns-notebook-site-6p22em
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      # The runner image already has the system libraries Chromium needs, so we skip
      # `--with-deps` (it pulls ~100 apt packages and fails when Ubuntu mirrors are flaky).
      # If the rebuild fails for any reason, the committed PDFs in public/pdf are deployed instead.
      - name: Rebuild the ready-made PDFs
        id: pdf
        continue-on-error: true
        timeout-minutes: 10
        run: |
          npx playwright install chromium
          npm run pdf

      - name: Note when committed PDFs were used
        if: steps.pdf.outcome == 'failure'
        run: echo "::warning::PDF rebuild failed; deploying the PDFs committed in public/pdf."

      - name: Make sure every page and PDF exists
        run: |
          for f in index.html all.html notes/circuit-breaker.html notes/saga.html \
                   pdf/01-circuit-breaker.pdf pdf/02-saga.pdf pdf/margin-notes.pdf; do
            test -s "public/$f" || { echo "Missing public/$f"; exit 1; }
          done
          touch public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
