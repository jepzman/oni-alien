30.0 -64.0 L32.0 -52.0 Z" fill="#0b0a10"/><g stroke="#15141a" stroke-width="1.2" opacity=".6" fill="none"><path d="M-14 46 L-12 2 M0 48 L-2 0 M12 46 L10 2"/></g><path d="M22 -4 C28 8 28 30 24 50" stroke="#9aff6a" stroke-width="1.6" fill="none" opacity=".6"/></g><g transform="translate(80 80) rotate(-12)"><rect width="100" height="80" fill="#d8dcd0" opacity="0.4"/><rect width="100" height="18" fill="#2a4a2a" opacity="0.4"/><text x="50" y="13" font-family="IM Fell English SC, Georgia, serif" font-size="10" fill="#e8f0e0" text-anchor="middle" >OCT</text></g><g transform="translate(90 94) rotate(-8)"><rect width="100" height="80" fill="#d8dcd0" opacity="0.5"/><rect width="100" height="18" fill="#2a4a2a" opacity="0.5"/><text x="50" y="13" font-family="IM Fell English SC, Georgia, serif" font-size="10" fill="#e8f0e0" text-anchor="middle" >NOV</text></g><g transform="translate(100 108) rotate(-4)"><rect width="100" height="80" fill="#d8dcd0" opacity="0.6000000000000001"/><rect width="100" height="18" fill="#2a4a2a" opacity="0.6000000000000001"/><text x="50" y="13" font-family="IM Fell English SC, Georgia, serif" font-size="10" fill="#e8f0e0" text-anchor="middle" >DEC</text></g><g transform="translate(110 122) rotate(0)"><rect width="100" height="80" fill="#d8dcd0" opacity="0.7000000000000001"/><rect width="100" height="18" fill="#2a4a2a" opacity="0.7000000000000001"/><text x="50" y="13" font-family="IM Fell English SC, Georgia, serif" font-size="10" fill="#e8f0e0" text-anchor="middle" >JAN</text></g><g transform="translate(120 136) rotate(4)"><rect width="100" height="80" fill="#d8dcd0" opacity="0.8"/><rect width="100" height="18" fill="#2a4a2a" opacity="0.8"/><text x="50" y="13" font-family="IM Fell English SC, Georgia, serif" font-size="10" fill="#e8f0e0" text-anchor="middle" >FEB</text></g><g transform="translate(130 150) rotate(8)"><rect width="100" height="80" fill="#d8dcd0" opacity="0.9"/><rect width="100" height="18" fill="#2a4a2a" opacity="0.9"/><text x="50" y="13" font-family="IM Fell English SC, Georgia, serif" font-size="10" fill="#e8f0e0" text-anchor="middle" >MAR</text></g><text x="160" y="250" font-family="Caveat, cursive" font-size="12" fill="#c8f0a8" text-anchor="middle" opacity=".75">“just a couple</text><text x="160" y="266" font-family="Caveat, cursive" font-size="12" fill="#c8f0a8" text-anchor="middle" opacity=".75">of months”</text><g transform="translate(250 480) scale(1.0)"><circle cx="0" cy="-150" r="20" fill="#06080a"/><path d="M-32 0 L-28 -110 C-22 -124 22 -124 28 -110 L32 0 Z" fill="#06080a"/><path d="M-20 -150 a20 20 0 0 1 40 0 M-28 -110 C-22 -124 22 -124 28 -110" stroke="#9aff6a" stroke-width="1.6" fill="none" opacity="0.7"/></g><text x="250" y="494" font-family="Caveat, cursive" font-size="11" fill="#9ad88a" text-anchor="middle" opacity=".75">Pip (9 people, same pay)</text><text x="620" y="470" font-family="EB Garamond, Georgia, serif" font-size="14" fill="#c8f0a8" text-anchor="middle" font-style="italic" opacity=".65">Read the label before you drink.</text>
