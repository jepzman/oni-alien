<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A gaunt, pale executive with slicked-back hair, pointed ears and red eyes stands in a dark boardroom, lit by the projector screen behind him. He holds up a USB stick tagged PIP_Q3_FORECAST_v4. His badge reads Dorian V., Strategy. His shadow on the wall has bat wings.">
  <defs>
    <radialGradient id="cv-screen" cx=".45" cy=".42" r=".7"><stop offset="0" stop-color="#f3dfb8"/><stop offset=".45" stop-color="#b4774c"/><stop offset=".85" stop-color="#3a1a14"/><stop offset="1" stop-color="#0a0606"/></radialGradient>
    <linearGradient id="cv-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1830"/><stop offset=".6" stop-color="#0a1222"/><stop offset="1" stop-color="#1c1410"/></linearGradient>
    <radialGradient id="cv-skin" cx=".36" cy=".36" r=".75"><stop offset="0" stop-color="#ece3d6"/><stop offset=".35" stop-color="#cfc6bb"/><stop offset=".7" stop-color="#8d8690"/><stop offset="1" stop-color="#3f3a48"/></radialGradient>
    <linearGradient id="cv-warm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb877" stop-opacity=".55"/><stop offset=".38" stop-color="#ffb877" stop-opacity="0"/></linearGradient>
    <linearGradient id="cv-cool" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#5d8fd0" stop-opacity=".45"/><stop offset=".35" stop-color="#5d8fd0" stop-opacity="0"/></linearGradient>
    <linearGradient id="cv-neck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2530"/><stop offset=".5" stop-color="#6e6874"/><stop offset="1" stop-color="#4a4450"/></linearGradient>
    <linearGradient id="cv-suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d2d38"/><stop offset="1" stop-color="#09090d"/></linearGradient>
    <linearGradient id="cv-suitwarm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d08a55" stop-opacity=".4"/><stop offset=".3" stop-color="#d08a55" stop-opacity="0"/></linearGradient>
    <linearGradient id="cv-tie" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0141c"/><stop offset=".5" stop-color="#5a070c"/><stop offset="1" stop-color="#2a0306"/></linearGradient>
    <linearGradient id="cv-shirt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff3e2"/><stop offset="1" stop-color="#8f96a6"/></linearGradient>
    <radialGradient id="cv-iris" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#ff6a3a"/><stop offset=".5" stop-color="#d0121a"/><stop offset="1" stop-color="#3a0000"/></radialGradient>
    <linearGradient id="cv-hand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2d6c6"/><stop offset="1" stop-color="#6f6876"/></linearGradient>
    <linearGradient id="cv-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eee"/><stop offset=".5" stop-color="#888"/><stop offset="1" stop-color="#444"/></linearGradient>
    <radialGradient id="cv-vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
    <filter id="cv-b2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="cv-b4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="cv-b8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="cv-glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cv-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer></filter>
    <clipPath id="cv-face"><path d="M418 150 C416 110 440 80 470 78 C500 80 524 110 522 150 C522 188 512 216 496 238 C486 252 478 258 470 258 C462 258 454 252 444 238 C428 216 418 188 418 150 Z"/></clipPath>
  </defs>

  <!-- the boardroom -->
  <rect width="800" height="500" fill="#07060a"/>
  <!-- projector screen with the stolen slide -->
  <rect x="-10" y="26" width="350" height="360" fill="url(#cv-screen)"/>
  <g opacity=".62" font-family="IM Fell English SC, Georgia, serif" fill="#2a160e">
    <text x="34" y="78" font-size="15" letter-spacing="2">Q3 LOAD FORECAST</text>
    <text x="34" y="104" font-size="22" font-family="Pirata One, Georgia, serif">presented by Dorian V., Strategy</text>
  </g>
  <g opacity=".45" fill="none" stroke="#2a160e"><path d="M40 300 H 300 M40 300 V 150" stroke-width="1.5"/>
    <polyline points="44,282 80,270 116,276 150,246 186,250 222,214 260,206 296,184" stroke-width="3.5"/>
    <polyline points="44,286 80,276 116,280 150,256 186,258 222,226 260,214 296,192" stroke-width="1.5" stroke-dasharray="5 4"/></g>
  <text x="200" y="330" font-family="Caveat, cursive" font-size="15" fill="#2a160e" opacity=".5">model: P. (small print, slide 41)</text>
  <!-- dust in the projector light -->
  <g fill="#fff4dd" opacity=".55"><circle cx="90" cy="140" r="1.2"/><circle cx="150" cy="200" r=".9"/><circle cx="230" cy="130" r="1.1"/><circle cx="260" cy="260" r=".8"/><circle cx="120" cy="320" r="1"/><circle cx="300" cy="90" r=".9"/><circle cx="60" cy="230" r=".8"/></g>

  <!-- the window: the city at night, rain, a pylon with a red light -->
  <rect x="610" y="0" width="190" height="500" fill="url(#cv-night)"/>
  <g filter="url(#cv-b4)"><circle cx="640" cy="330" r="7" fill="#ffb24a" opacity=".7"/><circle cx="668" cy="350" r="5" fill="#ffd38a" opacity=".6"/><circle cx="720" cy="320" r="6" fill="#7fd0e0" opacity=".5"/><circle cx="760" cy="346" r="8" fill="#ffb24a" opacity=".55"/><circle cx="785" cy="310" r="5" fill="#fff" opacity=".4"/><circle cx="690" cy="300" r="4" fill="#ffd38a" opacity=".5"/><circle cx="745" cy="372" r="5" fill="#ff8f4a" opacity=".5"/></g>
  <g stroke="#020308" stroke-width="2.2" fill="none"><path d="M742 330 L752 120 L762 330 M745 270 L759 270 M747 220 L757 220 M749 170 L755 170 M745 270 L757 220 L747 170 M759 270 L747 220 L755 170 M728 160 L776 160 M732 200 L772 200"/></g>
  <circle cx="752" cy="116" r="3" fill="#ff2a20" filter="url(#cv-glow)"><animate attributeName="opacity" values="1;.15;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <g stroke="#9fb6d6" stroke-width=".8" opacity=".22"><path d="M630 20 l-8 40 M660 90 l-8 40 M700 30 l-8 40 M740 140 l-8 40 M780 60 l-8 40 M650 200 l-8 40 M720 240 l-8 40 M770 220 l-8 40 M690 400 l-8 40 M760 420 l-8 40"/></g>
  <g fill="#050508"><rect x="604" y="0" width="10" height="500"/><rect x="698" y="0" width="7" height="500"/><rect x="610" y="246" width="190" height="7"/></g>

  <!-- his shadow on the wall has wings -->
  <path filter="url(#cv-b8)" fill="#000" opacity=".8" d="M540 300 C 548 230, 580 170, 640 120 C 628 160, 640 176, 662 172 C 640 196, 650 214, 672 214 C 650 236, 652 256, 674 262 C 640 270, 610 290, 590 330 Z"/>
  <path filter="url(#cv-b8)" fill="#000" opacity=".55" d="M560 160 L 580 112 L 586 156 Z"/>

  <ellipse cx="470" cy="110" rx="80" ry="70" fill="#4a6a9a" opacity=".35" filter="url(#cv-b8)"/>
  <!-- the jacket -->
  <path d="M290 500 C302 380 336 318 400 290 C420 282 440 276 452 272 L470 340 L488 272 C500 276 520 282 540 290 C604 318 636 380 650 500 Z" fill="url(#cv-suit)"/>
  <path d="M290 500 C302 380 336 318 400 290 C420 282 440 276 452 272 L470 340 L488 272 C500 276 520 282 540 290 C604 318 636 380 650 500 Z" fill="url(#cv-suitwarm)"/>
  <path d="M310 470 C 320 400, 346 340, 396 302" stroke="#e0a070" stroke-width="1.6" fill="none" opacity=".5"/>
  <!-- neck, collar, tie -->
  <path d="M448 232 L452 292 L488 292 L492 232 Z" fill="url(#cv-neck)"/>
  <path d="M440 278 L470 344 L500 278 L488 268 L470 298 L452 268 Z" fill="url(#cv-shirt)"/>
  <path d="M462 300 L478 300 L484 312 L476 318 L486 420 L470 446 L454 420 L464 318 L456 312 Z" fill="url(#cv-tie)"/>
  <path d="M468 322 L462 410" stroke="#ff6060" stroke-width="1" opacity=".35"/>
  <!-- lapels, a lightning-bolt pin, a pocket square folded into a bat -->
  <path d="M452 272 L470 340 L444 432 L418 322 L402 300 L430 294 Z" fill="#17171f" stroke="#40404e" stroke-width="1"/>
  <path d="M488 272 L470 340 L496 432 L522 322 L538 300 L510 294 Z" fill="#121219" stroke="#34343f" stroke-width="1"/>
  <path d="M426 318 L420 330 L426 330 L421 343 L432 326 L426 326 L430 318 Z" fill="#e3b04a" filter="url(#cv-glow)"/>
  <path d="M528 378 L578 372" stroke="#3a3a46" stroke-width="1.4"/>
  <path d="M532 377 L539 364 L546 370 L552 356 L558 369 L565 362 L573 373 Z" fill="#e9e3d8"/>
  <!-- the staff badge -->
  <path d="M452 276 C 430 320, 400 350, 384 372" stroke="#2c5e9a" stroke-width="4" fill="none"/>
  <g transform="rotate(-7 380 410)">
    <rect x="344" y="370" width="80" height="86" rx="4" fill="#efece4"/>
    <rect x="344" y="370" width="80" height="16" rx="4" fill="#9b1b1b"/>
    <text x="384" y="382" text-anchor="middle" font-family="IM Fell English SC, Georgia, serif" font-size="9" fill="#fff" letter-spacing="1">METROVOLT</text>
    <rect x="360" y="390" width="22" height="26" fill="#1b1b24"/><circle cx="371" cy="400" r="6" fill="#000"/><circle cx="369" cy="400" r="1.2" fill="#ff2a20"/><circle cx="373" cy="400" r="1.2" fill="#ff2a20"/>
    <text x="386" y="400" font-family="EB Garamond, Georgia, serif" font-size="8.5" font-weight="700" fill="#222">DORIAN V.</text>
    <text x="386" y="410" font-family="EB Garamond, Georgia, serif" font-size="7.5" fill="#444">Strategy</text>
    <text x="352" y="430" font-family="EB Garamond, Georgia, serif" font-size="6.5" fill="#555">ACCESS: ALL FLOORS</text>
    <text x="352" y="440" font-family="EB Garamond, Georgia, serif" font-size="6.5" fill="#9b1b1b">AFTER DARK ONLY</text>
  </g>

  <!-- the head: ears, face, hair -->
  <path d="M420 142 C410 128 402 112 397 92 C410 104 421 118 427 132 C429 150 427 168 421 178 C414 166 416 152 420 142 Z" fill="#8f8896"/>
  <path d="M520 142 C530 128 538 112 543 92 C530 104 519 118 513 132 C511 150 513 168 519 178 C526 166 524 152 520 142 Z" fill="#4c4756"/>
  <path d="M418 150 C416 110 440 80 470 78 C500 80 524 110 522 150 C522 188 512 216 496 238 C486 252 478 258 470 258 C462 258 454 252 444 238 C428 216 418 188 418 150 Z" fill="url(#cv-skin)"/>
  <g clip-path="url(#cv-face)">
    <rect x="410" y="70" width="120" height="200" fill="url(#cv-warm)"/>
    <rect x="410" y="70" width="120" height="200" fill="url(#cv-cool)"/>
    <!-- hollow cheeks, deep sockets, the shadow under the jaw -->
    <g filter="url(#cv-b8)" fill="#2a2434"><ellipse cx="440" cy="204" rx="11" ry="26" opacity=".5"/><ellipse cx="501" cy="204" rx="11" ry="26" opacity=".6"/>
      <ellipse cx="448" cy="152" rx="21" ry="12" opacity=".7"/><ellipse cx="492" cy="152" rx="21" ry="12" opacity=".75"/><ellipse cx="470" cy="262" rx="40" ry="14" opacity=".8"/></g>
    <ellipse cx="481" cy="190" rx="5" ry="16" fill="#3a3442" opacity=".35" filter="url(#cv-b4)"/>
    <path d="M466 160 L465 198" stroke="#fff" stroke-width="2.4" opacity=".25" filter="url(#cv-b2)"/>
    <ellipse cx="452" cy="118" rx="16" ry="8" fill="#fff" opacity=".18" filter="url(#cv-b4)"/>
  </g>
  <!-- eyes -->
  <path d="M434 154 Q448 144 462 152 Q448 160 434 154 Z" fill="#e8d6cc"/>
  <path d="M478 152 Q492 144 506 154 Q492 160 478 152 Z" fill="#cdb9b2"/>
  <circle cx="449" cy="153" r="5.2" fill="url(#cv-iris)"/><circle cx="491" cy="153" r="5.2" fill="url(#cv-iris)"/>
  <circle cx="449" cy="153" r="2" fill="#000"/><circle cx="491" cy="153" r="2" fill="#000"/>
  <circle cx="447.4" cy="151.3" r="1.2" fill="#fff"/><circle cx="489.4" cy="151.3" r="1.2" fill="#fff"/>
  <g filter="url(#cv-b4)" opacity=".7"><circle cx="449" cy="153" r="6" fill="#ff2a20"/><circle cx="491" cy="153" r="6" fill="#ff2a20"/></g>
  <path d="M433 154 Q448 143 463 152" stroke="#1b1418" stroke-width="1.6" fill="none"/><path d="M477 152 Q492 143 507 154" stroke="#1b1418" stroke-width="1.6" fill="none"/>
  <!-- brows: arched high outside, low inside -->
  <path d="M426 134 Q444 126 463 142" stroke="#141016" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <path d="M514 134 Q496 126 477 142" stroke="#141016" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M460 206 Q470 213 481 206" stroke="#4a3236" stroke-width="1.6" fill="none"/>
  <!-- the smirk, one fang -->
  <path d="M449 226 Q468 231 493 221" stroke="#3b1416" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <ellipse cx="470" cy="233" rx="14" ry="3" fill="#6b3036" opacity=".55"/>
  <path d="M482 227 L486 238 L489 226 Z" fill="#f4efe6"/>
  <path d="M495 216 Q499 223 495 230" stroke="#3a2c34" stroke-width="1.2" fill="none" opacity=".7"/>
  <!-- slicked hair with a widow's peak -->
  <path d="M414 142 C411 96 436 60 470 58 C504 60 529 96 526 142 C520 118 510 104 498 96 C490 106 480 114 470 130 C460 114 450 106 442 96 C430 104 420 118 414 142 Z" fill="#0b0a0e"/>
  <g stroke="#6c6a80" stroke-width="1.2" fill="none" opacity=".55"><path d="M444 92 C450 76 462 68 476 66"/><path d="M432 108 C436 88 448 76 462 72"/><path d="M486 66 C500 70 512 80 518 96" opacity=".4"/></g>
  <path d="M414 142 C411 96 436 60 470 58 C504 60 529 96 526 142" stroke="#8fb0e0" stroke-width="1.4" fill="none" opacity=".5"/>

  <!-- the hand, holding up your work -->
  <g transform="translate(34 0)">
  <path d="M556 500 C552 440 556 394 568 364 L618 372 C628 412 636 460 642 500 Z" fill="url(#cv-suit)"/>
  <path d="M566 362 L620 371 L618 384 L563 375 Z" fill="#e8e6e2"/><circle cx="604" cy="377" r="2.4" fill="#b01a1a"/>
  <path d="M572 360 C566 340 572 322 586 318 L612 322 C622 334 622 352 614 366 Z" fill="url(#cv-hand)"/>
  <g stroke="url(#cv-hand)" stroke-linecap="round" fill="none"><path d="M576 336 C573 318 580 306 592 300" stroke-width="9"/>
    <path d="M592 318 C592 300 596 290 600 282" stroke-width="8"/>
    <path d="M588 330 C602 326 614 330 618 338" stroke-width="8.5"/><path d="M588 342 C602 338 614 342 616 350" stroke-width="8"/><path d="M590 354 C602 352 610 356 610 362" stroke-width="7"/></g>
  <g fill="#2a2228"><path d="M598 280 L603 270 L604 283 Z"/><path d="M619 338 L626 341 L618 343 Z"/><path d="M617 350 L623 354 L616 355 Z"/></g>
  <!-- the USB stick and its tag -->
  <rect x="590" y="236" width="15" height="44" rx="2.5" fill="#1d1d22"/>
  <rect x="592" y="224" width="11" height="13" fill="url(#cv-metal)"/>
  <path d="M605 250 C 620 246, 628 240, 634 232" stroke="#d8cdb6" stroke-width=".8" fill="none"/>
  <g transform="rotate(-14 660 226)"><rect x="628" y="214" width="120" height="22" rx="2" fill="#efe6cf"/><circle cx="634" cy="225" r="2" fill="#07060a"/>
    <text x="640" y="229" font-family="Courier Prime, monospace" font-size="9.5" fill="#222">PIP_Q3_FORECAST_v4</text></g>
  </g>

  <!-- the mug, front left -->
  <g transform="translate(240 422)"><rect x="0" y="0" width="46" height="56" rx="4" fill="#d9d2c4"/><path d="M46 12 C62 12 62 40 46 40" stroke="#d9d2c4" stroke-width="6" fill="none"/>
    <rect x="0" y="0" width="46" height="56" rx="4" fill="url(#cv-warm)"/>
    <text x="23" y="22" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-size="7" font-weight="700" fill="#5a1a1a">WORLD'S BEST</text>
    <text x="23" y="32" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-size="7" font-weight="700" fill="#5a1a1a">TEAM PLAYER</text>
    <path d="M14 -6 C10 -16 22 -18 18 -30 M30 -6 C26 -16 38 -18 34 -30" stroke="#fff" stroke-width="1.2" fill="none" opacity=".2"/></g>
  <rect x="0" y="476" width="800" height="24" fill="#0c0806"/>
  <rect x="0" y="476" width="800" height="2" fill="#5a3a24" opacity=".6"/>

  <!-- film grain and vignette -->
  <rect width="800" height="500" fill="url(#cv-vig)"/>
  <rect width="800" height="500" filter="url(#cv-grain)"/>
</svg>
